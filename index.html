<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Beautiful Journey</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;600&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  font-family: 'Poppins', sans-serif;
  overflow: hidden;
}

/* Background image */
.background {
  position: fixed;
  inset: 0;
  background: url("pic14.jpg") center/cover no-repeat;
  z-index: -3;
}

/* Gradient overlay */
.overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.25),
    rgba(0,0,0,0.7)
  );
  z-index: -2;
}

/* Card */
.card {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 40px);
  max-width: 500px;
  background: rgba(255,255,255,0.96);
  border-radius: 26px;
  padding: 30px 24px;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0,0,0,0.35);
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.9rem;
  margin: 0 0 10px;
  color: #2b2b2b;
}

.subtitle {
  font-size: 0.95rem;
  color: #555;
  margin-bottom: 20px;
}

/* Journey counter */
.journey {
  font-size: 1.8rem;
  font-weight: 700;
  color: #c92a5a;
}

.small {
  font-size: 0.9rem;
  margin-top: 6px;
  color: #777;
}

/* Music button */
.music-btn {
  margin-top: 18px;
  background: #c92a5a;
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 0.85rem;
  cursor: pointer;
}

/* Floating hearts */
.heart {
  position: absolute;
  bottom: -20px;
  font-size: 18px;
  animation: floatUp linear infinite;
  opacity: 0.6;
}

@keyframes floatUp {
  from {
    transform: translateY(0) scale(1);
    opacity: 0.8;
  }
  to {
    transform: translateY(-110vh) scale(1.4);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="card">

  <h1>Our Beautiful Marriage Journey 💍</h1>

  <div class="subtitle">
    Celebrating every day of love, patience, laughter and partnership
  </div>

  <div class="journey" id="marriageDuration">
    Calculating...
  </div>

  <div class="small">
    and still going strong ❤️
  </div>

  <button class="music-btn" id="musicBtn">🎵 Play Music</button>

</div>

<script>

/* ======================
   SET WEDDING DATE
   ====================== */
const WEDDING_DATE = new Date("2026-02-24");

/* Marriage duration calculator */

function calculateDuration() {

  const now = new Date();

  let years = now.getFullYear() - WEDDING_DATE.getFullYear();
  let months = now.getMonth() - WEDDING_DATE.getMonth();
  let days = now.getDate() - WEDDING_DATE.getDate();

  if (days < 0) {
    months--;
    const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
    days += prevMonth.getDate();
  }

  if (months < 0) {
    years--;
    months += 12;
  }

  let text = "";

  if (years > 0) {
    text = `${years} year${years>1?"s":""}, ${months} month${months!=1?"s":""}, ${days} day${days!=1?"s":""}`;
  }
  else if (months > 0) {
    text = `${months} month${months>1?"s":""}, ${days} day${days!=1?"s":""}`;
  }
  else {
    const diffDays = Math.floor((now - WEDDING_DATE)/(1000*60*60*24));
    text = `${diffDays} day${diffDays>1?"s":""}`;
  }

  document.getElementById("marriageDuration").textContent = text;

}

calculateDuration();
setInterval(calculateDuration, 60000);


/* Background music */
const music = document.getElementById("bgMusic");
const btn = document.getElementById("musicBtn");

music.volume = 0.6;

music.play().then(()=>{
  btn.style.display="none";
}).catch(()=>{
  btn.style.display="inline-block";
});

btn.onclick = ()=>{
  music.play();
  btn.style.display="none";
};


/* Floating hearts */
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = Math.random() > 0.5 ? "💖" : "✨";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (7 + Math.random() * 6) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 13000);
}

setInterval(createHeart, 900);

</script>

</body>
</html>
